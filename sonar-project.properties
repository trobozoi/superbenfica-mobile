# Configuração do SonarScanner para o Super Benfica Mobile (SonarQube Cloud).
# O token (SONAR_TOKEN) vem do secret do GitHub Actions ou da variável de ambiente local.

sonar.organization=trobozoi
sonar.projectKey=trobozoi_superbenfica-mobile
sonar.projectName=Super Benfica Mobile
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,__integration__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,__integration__/**
sonar.exclusions=**/node_modules/**,coverage/**,**/*.d.ts,**/*.test.ts,**/*.test.tsx

# Relatório gerado por: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Telas, componentes visuais, navegação e bootstrap são validados manualmente/E2E
# (não geram lcov). Os serviços HTTP finos são cobertos pelos testes de integração
# contra a API real (npm run test:integration), que também não geram lcov.
# A lógica (config, utils, store, cliente HTTP, WebSocket, offline, hooks) tem testes de unidade.
sonar.coverage.exclusions=src/app/**,src/screens/**,src/components/**,src/navigation/**,src/theme/**,src/types/**,src/services/api/auth.service.ts,src/services/api/catalog.service.ts,src/services/api/customer.service.ts,src/services/api/orders.service.ts,src/services/notifications/**,src/hooks/useConnectivity.ts,src/hooks/useRealtime.ts
